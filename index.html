<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cake Pop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: #09080e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Заголовок в стиле референса: стильный, мягкий, без кислотного неона */
    .title-logo {
      font-size: 22px;
      font-weight: 800;
      color: #e2e8f0;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    /* Баланс-бар с глухим премиум-покрытием */
    .balance-card {
      width: 100%;
      max-width: 380px;
      background: rgba(22, 19, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .balance-text {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }

    .balance-val {
      color: #fbbf24;
      font-weight: 800;
      font-size: 17px;
    }

    .btn-bonus {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
    }

    .btn-bonus:active {
      transform: scale(0.96);
    }

    /* Настройки ставки */
    .settings-row {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-box label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .input-box input, .input-box select {
      background: rgba(22, 19, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    /* Главная кнопка: сдержанный премиум градиент в стиле Spin Again */
    .btn-action {
      width: 100%;
      max-width: 380px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #6366f1 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: transform 0.1s, opacity 0.2s;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.2);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action.cashout {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* Статы раунда */
    .stats-bar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .stat-val {
      color: #38bdf8;
      font-weight: 700;
    }

    .stat-profit {
      color: #34d399;
      font-weight: 700;
    }

    /* Игровое поле: глухой фиолетовый фон и обрамления */
    .grid {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .cell {
      aspect-ratio: 1;
      background: #171328;
      border: 2px solid #332654;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s, border-color 0.2s;
    }

    .cell:active {
      transform: scale(0.93);
    }

    .cell.loading {
      opacity: 0.5;
      border-color: #a855f7;
    }

    .cell.revealed-gem {
      background: #122822;
      border-color: #10b981;
    }

    .cell.revealed-bomb {
      background: #2d141e;
      border-color: #f43f5e;
    }
  </style>
</head>
<body>

  <div class="title-logo">🧁 Cake Pop</div>

  <div class="balance-card">
    <div class="balance-text">Баланс: <span id="balanceText" class="balance-val">0</span> $CAKE</div>
    <button class="btn-bonus" onclick="addBonus()">+500 🧁</button>
  </div>

  <div class="settings-row">
    <div class="input-box">
      <label>СТАВКА ($CAKE)</label>
      <input type="number" id="betAmount" value="50">
    </div>
    <div class="input-box">
      <label>ЛОВУШКИ</label>
      <select id="minesCount">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <button id="mainBtn" class="btn-action" onclick="handleMainAction()">НОВАЯ ИГРА</button>

  <div class="stats-bar">
    <div>Множитель: <span id="currentMult" class="stat-val">1.00x</span></div>
    <div>Выигрыш: <span id="profitText" class="stat-profit">+0 $CAKE</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const BACKEND_URL = 'https://cake-pop-bot.onrender.com';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    const initData = tg?.initData || '';
    const user = tg?.initDataUnsafe?.user;
    const fallbackTelegramId = user ? user.id : 123456789;

    const GRID_SIZE = 25;
    let gameOver = true;
    let balance = 0;

    function updateBalanceDisplay() {
      const el = document.getElementById('balanceText');
      if (el) el.innerText = Math.floor(balance);
    }

    async function fetchUserBalance() {
      try {
        const response = await fetch(`${BACKEND_URL}/api/user?telegram_id=${fallbackTelegramId}`);
        const data = await response.json();
        if (data.balance !== undefined) {
          balance = Number(data.balance);
          updateBalanceDisplay();
        }
      } catch (err) {
        console.error('Ошибка загрузки баланса:', err);
      }
    }

    async function startGame() {
      const betInput = document.getElementById('betAmount');
      const currentBet = parseFloat(betInput.value);
      const minesCount = parseInt(document.getElementById('minesCount').value);

      if (isNaN(currentBet) || currentBet <= 0) {
        alert("Введите корректную ставку!");
        return;
      }
      if (currentBet > balance) {
        alert("Недостаточно $CAKE!");
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId,
            betAmount: currentBet,
            minesCount
          })
        });

        const data = await response.json();
        if (!response.ok || data.error) {
          alert(data.error || "Ошибка старта");
          return;
        }

        balance = Number(data.balance);
        updateBalanceDisplay();

        gameOver = false;
        betInput.disabled = true;
        document.getElementById('minesCount').disabled = true;

        document.getElementById('currentMult').innerText = '1.00x';
        document.getElementById('profitText').innerText = '+0 $CAKE';

        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = "ЗАБРАТЬ (0 $CAKE)";
        mainBtn.classList.add('cashout');

        renderEmptyGrid(true);
      } catch (err) {
        console.error('Ошибка старта:', err);
      }
    }

    async function handleCellClick(cell, index) {
      if (gameOver || cell.dataset.revealed || cell.dataset.loading) return;

      cell.dataset.loading = "true";
      cell.classList.add('loading');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/open-cell`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId,
            cellIndex: index
          })
        });

        const data = await response.json();
        delete cell.dataset.loading;
        cell.classList.remove('loading');
        cell.dataset.revealed = "true";

        if (data.hitMine) {
          cell.innerText = "❌";
          cell.classList.add('revealed-bomb');
          endGame(false, data.mines);
        } else {
          cell.innerText = "🧁";
          cell.classList.add('revealed-gem');

          document.getElementById('currentMult').innerText = data.multiplier + 'x';
          document.getElementById('profitText').innerText = `+${data.profit} $CAKE`;

          const mainBtn = document.getElementById('mainBtn');
          mainBtn.innerText = `ЗАБРАТЬ (${data.profit} $CAKE)`;

          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
      } catch (err) {
        delete cell.dataset.loading;
        cell.classList.remove('loading');
        console.error('Ошибка открытия:', err);
      }
    }

    async function cashOut() {
      if (gameOver) return;

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/cashout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId
          })
        });

        const data = await response.json();
        if (data.success) {
          balance = Number(data.balance);
          updateBalanceDisplay();
          endGame(true, data.mines);
        }
      } catch (err) {
        console.error('Ошибка кэшаута:', err);
      }
    }

    function endGame(isWin, minesList = []) {
      gameOver = true;

      if (minesList.length > 0) {
        const grid = document.getElementById('grid');
        minesList.forEach(mIndex => {
          const mCell = grid.children[mIndex];
          if (mCell && !mCell.dataset.revealed) {
            mCell.innerText = "❌";
            mCell.classList.add('revealed-bomb');
          }
        });
      }

      const mainBtn = document.getElementById('mainBtn');
      mainBtn.classList.remove('cashout');
      mainBtn.innerText = "НОВАЯ ИГРА";

      document.getElementById('betAmount').disabled = false;
      document.getElementById('minesCount').disabled = false;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred(isWin ? 'success' : 'error');
      }
    }

    function handleMainAction() {
      if (gameOver) {
        startGame();
      } else {
        cashOut();
      }
    }

    function renderEmptyGrid(interactive = false) {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if (interactive) {
          cell.addEventListener('click', () => handleCellClick(cell, i));
        }
        grid.appendChild(cell);
      }
    }

    async function addBonus() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/bonus`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: fallbackTelegramId })
        });
        const data = await res.json();
        if (data.success) {
          balance = Number(data.balance);
          updateBalanceDisplay();
        }
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderEmptyGrid(false);
      fetchUserBalance();
    });
  </script>
</body>
</html>
