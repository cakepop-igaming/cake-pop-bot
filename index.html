<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cake Pop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: #0f111a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .title-logo {
      font-size: 24px;
      font-weight: 900;
      color: #ff66c4;
      text-shadow: 0 0 12px rgba(255, 102, 196, 0.6);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Баланс-бар */
    .balance-card {
      width: 100%;
      max-width: 380px;
      background: #181b26;
      border: 1px solid #282c3f;
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .balance-text {
      font-size: 15px;
      font-weight: 700;
      color: #a0a5ba;
    }

    .balance-val {
      color: #ffcc00;
      font-size: 18px;
    }

    .btn-bonus {
      background: #2a52be;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(42, 82, 190, 0.4);
      transition: transform 0.1s;
    }

    .btn-bonus:active {
      transform: scale(0.95);
    }

    /* Настройки ставки */
    .settings-row {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-box label {
      font-size: 11px;
      font-weight: 800;
      color: #6c728e;
      letter-spacing: 0.5px;
    }

    .input-box input, .input-box select {
      background: #181b26;
      border: 1px solid #282c3f;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      outline: none;
    }

    /* Главная кнопка */
    .btn-action {
      width: 100%;
      max-width: 380px;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #ff3399;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 51, 153, 0.4);
      margin-bottom: 16px;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action.cashout {
      background: #00d285;
      box-shadow: 0 6px 20px rgba(0, 210, 133, 0.4);
    }

    /* Статы раунда */
    .stats-bar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: #a0a5ba;
      margin-bottom: 14px;
    }

    .stat-val {
      color: #00e5ff;
    }

    .stat-profit {
      color: #00d285;
    }

    /* Игровое поле */
    .grid {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .cell {
      aspect-ratio: 1;
      background: #251b4e;
      border: 2px solid #3d2b80;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s, border-color 0.2s;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
    }

    .cell:active {
      transform: scale(0.92);
    }

    .cell.loading {
      opacity: 0.6;
      border-color: #00e5ff;
    }

    .cell.revealed-gem {
      background: #1c2b4a;
      border-color: #00e5ff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }

    .cell.revealed-bomb {
      background: #4a1c24;
      border-color: #ff3355;
      box-shadow: 0 0 12px rgba(255, 51, 85, 0.4);
    }
  </style>
</head>
<body>

  <div class="title-logo">🧁 Cake Pop</div>

  <div class="balance-card">
    <div class="balance-text">Баланс: <span id="balanceText" class="balance-val">0</span> $CAKE</div>
    <button class="btn-bonus" onclick="addBonus()">+500 🧁</button>
  </div>

  <div class="settings-row">
    <div class="input-box">
      <label>СТАВКА ($CAKE)</label>
      <input type="number" id="betAmount" value="50">
    </div>
    <div class="input-box">
      <label>ЛОУШКИ</label>
      <select id="minesCount">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <button id="mainBtn" class="btn-action" onclick="handleMainAction()">НОВАЯ ИГРА</button>

  <div class="stats-bar">
    <div>Множитель: <span id="currentMult" class="stat-val">1.00x</span></div>
    <div>Выигрыш: <span id="profitText" class="stat-profit">+0 $CAKE</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const BACKEND_URL = 'https://cake-pop-bot.onrender.com';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    const initData = tg?.initData || '';
    const user = tg?.initDataUnsafe?.user;
    const fallbackTelegramId = user ? user.id : 123456789;

    const GRID_SIZE = 25;
    let gameOver = true;
    let balance = 0;

    function updateBalanceDisplay() {
      const el = document.getElementById('balanceText');
      if (el) el.innerText = Math.floor(balance);
    }

    async function fetchUserBalance() {
      try {
        const response = await fetch(`${BACKEND_URL}/api/user?telegram_id=${fallbackTelegramId}`);
        const data = await response.json();
        if (data.balance !== undefined) {
          balance = Number(data.balance);
          updateBalanceDisplay();
        }
      } catch (err) {
        console.error('Ошибка загрузки баланса:', err);
      }
    }

    async function startGame() {
      const betInput = document.getElementById('betAmount');
      const currentBet = parseFloat(betInput.value);
      const minesCount = parseInt(document.getElementById('minesCount').value);

      if (isNaN(currentBet) || currentBet <= 0) {
        alert("Введите корректную ставку!");
        return;
      }
      if (currentBet > balance) {
        alert("Недостаточно $CAKE!");
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId,
            betAmount: currentBet,
            minesCount
          })
        });

        const data = await response.json();
        if (!response.ok || data.error) {
          alert(data.error || "Ошибка старта");
          return;
        }

        balance = Number(data.balance);
        updateBalanceDisplay();

        gameOver = false;
        betInput.disabled = true;
        document.getElementById('minesCount').disabled = true;

        document.getElementById('currentMult').innerText = '1.00x';
        document.getElementById('profitText').innerText = '+0 $CAKE';

        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = "ЗАБРАТЬ (0 $CAKE)";
        mainBtn.classList.add('cashout');

        renderEmptyGrid(true);
      } catch (err) {
        console.error('Ошибка старта:', err);
      }
    }

    async function handleCellClick(cell, index) {
      if (gameOver || cell.dataset.revealed || cell.dataset.loading) return;

      // Optimistic UI: даем отклик сразу
      cell.dataset.loading = "true";
      cell.classList.add('loading');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/open-cell`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId,
            cellIndex: index
          })
        });

        const data = await response.json();
        delete cell.dataset.loading;
        cell.classList.remove('loading');
        cell.dataset.revealed = "true";

        if (data.hitMine) {
          cell.innerText = "❌";
          cell.classList.add('revealed-bomb');
          endGame(false, data.mines);
        } else {
          cell.innerText = "🧁";
          cell.classList.add('revealed-gem');

          document.getElementById('currentMult').innerText = data.multiplier + 'x';
          document.getElementById('profitText').innerText = `+${data.profit} $CAKE`;

          const mainBtn = document.getElementById('mainBtn');
          mainBtn.innerText = `ЗАБРАТЬ (${data.profit} $CAKE)`;

          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
      } catch (err) {
        delete cell.dataset.loading;
        cell.classList.remove('loading');
        console.error('Ошибка открытия:', err);
      }
    }

    async function cashOut() {
      if (gameOver) return;

      try {
        const response = await fetch(`${BACKEND_URL}/api/game/cashout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData,
            fallback_telegram_id: fallbackTelegramId
          })
        });

        const data = await response.json();
        if (data.success) {
          balance = Number(data.balance);
          updateBalanceDisplay();
          endGame(true, data.mines);
        }
      } catch (err) {
        console.error('Ошибка кэшаута:', err);
      }
    }

    function endGame(isWin, minesList = []) {
      gameOver = true;

      if (minesList.length > 0) {
        const grid = document.getElementById('grid');
        minesList.forEach(mIndex => {
          const mCell = grid.children[mIndex];
          if (mCell && !mCell.dataset.revealed) {
            mCell.innerText = "❌";
            mCell.classList.add('revealed-bomb');
          }
        });
      }

      const mainBtn = document.getElementById('mainBtn');
      mainBtn.classList.remove('cashout');
      mainBtn.innerText = "НОВАЯ ИГРА";

      document.getElementById('betAmount').disabled = false;
      document.getElementById('minesCount').disabled = false;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred(isWin ? 'success' : 'error');
      }
    }

    function handleMainAction() {
      if (gameOver) {
        startGame();
      } else {
        cashOut();
      }
    }

    function renderEmptyGrid(interactive = false) {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if (interactive) {
          cell.addEventListener('click', () => handleCellClick(cell, i));
        }
        grid.appendChild(cell);
      }
    }

    async function addBonus() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/bonus`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: fallbackTelegramId })
        });
        const data = await res.json();
        if (data.success) {
          balance = Number(data.balance);
          updateBalanceDisplay();
        }
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderEmptyGrid(false);
      fetchUserBalance();
    });
  </script>
</body>
</html>
