<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cake Pop</title>
  <script>
  const BACKEND_URL = 'https://cake-pop-bot.onrender.com';

  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (e) {}
  }

  // Получаем initData для подписи или fallback ID для браузера
  const initData = tg?.initData || '';
  const user = tg?.initDataUnsafe?.user;
  const fallbackTelegramId = user ? user.id : 123456789;

  const GRID_SIZE = 25;
  let revealedCount = 0;
  let gameOver = true;
  let currentMultiplier = 1.00;
  let currentBet = 50;
  let balance = 0;

  function updateBalanceDisplay() {
    const el = document.getElementById('balanceText');
    if (el) el.innerText = Math.floor(balance);
  }

  // Загрузка баланса из Supabase при запуске
  async function fetchUserBalance() {
    try {
      const response = await fetch(`${BACKEND_URL}/api/user?telegram_id=${fallbackTelegramId}`);
      const data = await response.json();
      if (data.balance !== undefined) {
        balance = Number(data.balance);
        updateBalanceDisplay();
      }
    } catch (err) {
      console.error('Ошибка загрузки баланса:', err);
    }
  }

  // 1. СТАРТ ИГРЫ (Отправляем на сервер)
  async function startGame() {
    const betInput = document.getElementById('betAmount');
    currentBet = parseFloat(betInput.value);
    const minesCount = parseInt(document.getElementById('minesCount').value);

    if (isNaN(currentBet) || currentBet <= 0) {
      alert("Введите корректную ставку!");
      return;
    }
    if (currentBet > balance) {
      alert("Недостаточно $CAKE на балансе!");
      return;
    }

    try {
      const response = await fetch(`${BACKEND_URL}/api/game/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: initData,
          fallback_telegram_id: fallbackTelegramId,
          betAmount: currentBet,
          minesCount: minesCount
        })
      });

      const data = await response.json();

      if (!response.ok || data.error) {
        alert(data.error || "Ошибка старта игры");
        return;
      }

      // Обновляем баланс, списанный сервером
      balance = Number(data.balance);
      updateBalanceDisplay();

      revealedCount = 0;
      gameOver = false;
      currentMultiplier = 1.00;

      document.getElementById('betAmount').disabled = true;
      document.getElementById('minesCount').disabled = true;
      document.getElementById('currentMult').innerText = '1.00x';
      document.getElementById('profitText').innerText = '0 $CAKE';
      
      const mainBtn = document.getElementById('mainBtn');
      mainBtn.innerText = "ЗАБРАТЬ (0 $CAKE)";
      mainBtn.classList.add('cashout');

      // Рисуем сетку
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.addEventListener('click', () => handleCellClick(cell, i));
        grid.appendChild(cell);
      }

    } catch (err) {
      console.error('Ошибка старта:', err);
    }
  }

  // 2. КЛИК ПО ЯЧЕЙКЕ (Проверка на сервере)
  async function handleCellClick(cell, index) {
    if (gameOver || cell.dataset.revealed) return;
    cell.dataset.revealed = "true";

    try {
      const response = await fetch(`${BACKEND_URL}/api/game/open-cell`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: initData,
          fallback_telegram_id: fallbackTelegramId,
          cellIndex: index
        })
      });

      const data = await response.json();

      if (data.hitMine) {
        // Попал на мину
        cell.innerText = "❌";
        cell.classList.add('revealed-bomb');
        endGame(false, data.mines);
      } else {
        // Безопасная ячейка
        cell.innerText = "🧁";
        cell.classList.add('revealed-gem');
        
        currentMultiplier = data.multiplier;
        const winTotal = data.profit;

        document.getElementById('currentMult').innerText = currentMultiplier + 'x';
        document.getElementById('profitText').innerText = `+${winTotal} $CAKE`;
        
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = `ЗАБРАТЬ (${winTotal} $CAKE)`;

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      }

    } catch (err) {
      console.error('Ошибка открытия ячейки:', err);
    }
  }

  // 3. ЗАБРАТЬ ВЫИГРЫШ (Кэшаут)
  async function cashOut() {
    if (gameOver) return;

    try {
      const response = await fetch(`${BACKEND_URL}/api/game/cashout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: initData,
          fallback_telegram_id: fallbackTelegramId
        })
      });

      const data = await response.json();

      if (data.success) {
        balance = Number(data.balance);
        updateBalanceDisplay();
        endGame(true, data.mines);
      }
    } catch (err) {
      console.error('Ошибка кэшаута:', err);
    }
  }

  function endGame(isWin, minesList = []) {
    gameOver = true;
    
    // Раскрываем все мины, полученные от сервера
    if (minesList.length > 0) {
      const grid = document.getElementById('grid');
      minesList.forEach(mIndex => {
        const mCell = grid.children[mIndex];
        if (mCell && !mCell.dataset.revealed) {
          mCell.innerText = "❌";
          mCell.classList.add('revealed-bomb');
        }
      });
    }

    const mainBtn = document.getElementById('mainBtn');
    mainBtn.classList.remove('cashout');
    mainBtn.innerText = "НОВАЯ ИГРА";

    document.getElementById('betAmount').disabled = false;
    document.getElementById('minesCount').disabled = false;

    if (tg?.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred(isWin ? 'success' : 'error');
    }
  }

  function handleMainAction() {
    if (gameOver) {
      startGame();
    } else {
      cashOut();
    }
  }

  function renderEmptyGrid() {
    const grid = document.getElementById('grid');
    if (!grid) return;
    grid.innerHTML = '';
    for (let i = 0; i < GRID_SIZE; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      grid.appendChild(cell);
    }
  }

  // Кнопка теста бонуса +500
  async function addBonus() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/bonus`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: fallbackTelegramId })
      });
      const data = await res.json();
      if (data.success) {
        balance = Number(data.balance);
        updateBalanceDisplay();
      }
    } catch (e) {}
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderEmptyGrid();
    fetchUserBalance();
  });
</script>
</body>
</html>
